[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docmd-cli"
version = "0.1.9"
description = "Convert PDFs, DOCX, and PPTX to clean, structure-preserving Markdown."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "taherzribi" }]
requires-python = ">=3.10,<4"
keywords = ["pdf", "docx", "pptx", "markdown", "rag", "document-conversion"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "marker-pdf==2.0.0",
    "click<9,>=8.2.0",
]

[project.optional-dependencies]
full = [
    "marker-pdf[full]==2.0.0",
]
dev = [
    "pytest>=8.0.0",
    "reportlab>=4.0.0",
    "python-docx>=1.1.0",
    "ruff>=0.16.0,<1",
    "mypy>=2.0.0,<3",
]

[project.urls]
Homepage = "https://github.com/taherzribi/docmd"
Issues = "https://github.com/taherzribi/docmd/issues"

[project.scripts]
docmd = "docmd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["docmd"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
